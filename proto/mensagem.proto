syntax = "proto3";

message LoginRequest {
  string usuario = 1;
  int64 timestamp = 2;
}

message LoginResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
}

message CriarCanalRequest {
  string nome_canal = 1;
  int64 timestamp = 2;
}

message CriarCanalResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
}

message ListarCanaisRequest {
  int64 timestamp = 1;
}

message ListarCanaisResponse {
  repeated string canais = 1;
  int64 timestamp = 2;
}

message PublicarRequest {
  string usuario = 1;
  string canal = 2;
  string mensagem = 3;
  int64 timestamp = 4;
}

message PublicarResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
}

message Publicacao {
  string canal = 1;
  string mensagem = 2;
  string usuario = 3;
  int64 timestamp = 4;
}

