syntax = "proto3";

// timestamp: relogio fisico de quem envia
// relogio: relogio logico (contador) de quem envia

message LoginRequest {
  string usuario = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message LoginResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message CriarCanalRequest {
  string nome_canal = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message CriarCanalResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message ListarCanaisRequest {
  int64 timestamp = 1;
  int64 relogio = 2;
}

message ListarCanaisResponse {
  repeated string canais = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message PublicarRequest {
  string usuario = 1;
  string canal = 2;
  string mensagem = 3;
  int64 timestamp = 4;
  int64 relogio = 5;
}

message PublicarResponse {
  bool sucesso = 1;
  string erro = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message Publicacao {
  string canal = 1;
  string mensagem = 2;
  string usuario = 3;
  int64 timestamp = 4;
  int64 relogio = 5;
}

message RankRequest {
  string nome = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message RankResponse {
  int32 rank = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message ServidorInfo {
  string nome = 1;
  int32 rank = 2;
}

message ListaServidoresRequest {
  int64 timestamp = 1;
  int64 relogio = 2;
}

message ListaServidoresResponse {
  repeated ServidorInfo servidores = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message HeartbeatRequest {
  string nome = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message RelogioRequest {
  string nome = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message RelogioResponse {
  int64 timestamp = 1;
  int64 relogio = 2;
}

message EleicaoRequest {
  string nome = 1;
  int32 rank = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message EleicaoResponse {
  string resposta = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message CoordenadorAnuncio {
  string nome = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message LoginDado {
  string usuario = 1;
  int64 timestamp = 2;
}

message PublicacaoDado {
  string canal = 1;
  string mensagem = 2;
  string usuario = 3;
  int64 timestamp = 4;
}

message Replicacao {
  string origem = 1;
  oneof dado {
    LoginDado login = 2;
    string canal = 3;
    PublicacaoDado publicacao = 4;
  }
  int64 timestamp = 5;
  int64 relogio = 6;
}

message DadosRequest {
  string nome = 1;
  int64 timestamp = 2;
  int64 relogio = 3;
}

message DadosResponse {
  repeated LoginDado logins = 1;
  repeated string canais = 2;
  repeated PublicacaoDado publicacoes = 3;
  int64 timestamp = 4;
  int64 relogio = 5;
}

// protoc --proto_path=proto --python_out=python --java_out=java/src/main/java proto/mensagem.proto
