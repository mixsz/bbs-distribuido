services:
  broker:
    container_name: broker
    build: ./python
    command: python broker.py
    environment:
      TZ: America/Sao_Paulo

  proxy:
    container_name: proxy
    build: ./python
    command: python proxy.py
    environment:
      TZ: America/Sao_Paulo

  referencia:
    container_name: referencia
    build: ./python
    command: python referencia.py
    environment:
      TZ: America/Sao_Paulo
      TIMEOUT_SERVIDOR: "30"
      PAUSA_MS: "200"

  servidor-python:
    container_name: servidor-python
    build: ./python
    environment:
      TZ: America/Sao_Paulo
      NOME_SERVIDOR: servidor-python
      DESVIO_RELOGIO_MS: "0"
      PAUSA_MS: "200"
      DADOS_PATH: /data/dados.json
      BROKER_ENDERECO: tcp://broker:5556
      PROXY_PUB_ENDERECO: tcp://proxy:5557
      REFERENCIA_ENDERECO: tcp://referencia:5559
    volumes:
      - ./dados/python:/data
    depends_on:
      - broker
      - proxy
      - referencia

  servidor-python-2:
    container_name: servidor-python-2
    build: ./python
    environment:
      TZ: America/Sao_Paulo
      NOME_SERVIDOR: servidor-python-2
      DESVIO_RELOGIO_MS: "0"
      PAUSA_MS: "200"
      DADOS_PATH: /data/dados.json
      BROKER_ENDERECO: tcp://broker:5556
      PROXY_PUB_ENDERECO: tcp://proxy:5557
      REFERENCIA_ENDERECO: tcp://referencia:5559
    volumes:
      - ./dados/python-2:/data
    depends_on:
      - broker
      - proxy
      - referencia

  servidor-java:
    container_name: servidor-java
    build: ./java
    environment:
      TZ: America/Sao_Paulo
      NOME_SERVIDOR: servidor-java
      DESVIO_RELOGIO_MS: "4000"
      PAUSA_MS: "200"
      DADOS_PATH: /data/dados.json
      BROKER_ENDERECO: tcp://broker:5556
      PROXY_PUB_ENDERECO: tcp://proxy:5557
      REFERENCIA_ENDERECO: tcp://referencia:5559
    volumes:
      - ./dados/java:/data
    depends_on:
      - broker
      - proxy
      - referencia

  servidor-java-2:
    container_name: servidor-java-2
    build: ./java
    environment:
      TZ: America/Sao_Paulo
      NOME_SERVIDOR: servidor-java-2
      DESVIO_RELOGIO_MS: "4000"
      PAUSA_MS: "200"
      DADOS_PATH: /data/dados.json
      BROKER_ENDERECO: tcp://broker:5556
      PROXY_PUB_ENDERECO: tcp://proxy:5557
      REFERENCIA_ENDERECO: tcp://referencia:5559
    volumes:
      - ./dados/java-2:/data
    depends_on:
      - broker
      - proxy
      - referencia

  bot-python:
    container_name: bot-python
    build: ./python
    command: python bot.py
    environment:
      TZ: America/Sao_Paulo
      SERVIDOR_ENDERECO: tcp://broker:5555
      PROXY_SUB_ENDERECO: tcp://proxy:5558
      USUARIO: bot-python-1
    depends_on:
      - broker
      - proxy
      - servidor-python
      - servidor-python-2
      - servidor-java
      - servidor-java-2

  bot-python-2:
    container_name: bot-python-2
    build: ./python
    command: python bot.py
    environment:
      TZ: America/Sao_Paulo
      SERVIDOR_ENDERECO: tcp://broker:5555
      PROXY_SUB_ENDERECO: tcp://proxy:5558
      USUARIO: bot-python-2
    depends_on:
      - broker
      - proxy
      - servidor-python
      - servidor-python-2
      - servidor-java
      - servidor-java-2

  bot-java:
    container_name: bot-java
    build: ./java
    command: ["java", "-cp", "target/classes:target/lib/*", "Bot"]
    environment:
      TZ: America/Sao_Paulo
      SERVIDOR_ENDERECO: tcp://broker:5555
      PROXY_SUB_ENDERECO: tcp://proxy:5558
      USUARIO: bot-java-1
    depends_on:
      - broker
      - proxy
      - servidor-python
      - servidor-python-2
      - servidor-java
      - servidor-java-2

  bot-java-2:
    container_name: bot-java-2
    build: ./java
    command: ["java", "-cp", "target/classes:target/lib/*", "Bot"]
    environment:
      TZ: America/Sao_Paulo
      SERVIDOR_ENDERECO: tcp://broker:5555
      PROXY_SUB_ENDERECO: tcp://proxy:5558
      USUARIO: bot-java-2
    depends_on:
      - broker
      - proxy
      - servidor-python
      - servidor-python-2
      - servidor-java
      - servidor-java-2